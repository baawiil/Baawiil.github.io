name: Déployer le portfolio Tailwind
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Tailwind
        run: npm install --no-audit --no-fund
      - name: Générer le CSS et le site statique
        run: |
          npm run build
          cp index.html script.js robots.txt sitemap.xml dist/
          cp -R media dist/
          touch dist/.nojekyll
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
